services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library_ptit
      MYSQL_USER: library_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-library-demo-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-demo-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root-demo-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-ptit-library-docker-development-change-before-deploy}
      DB_USER: library_app
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-library-demo-password}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: library_ptit
      FRONTEND_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  mysql_data:
